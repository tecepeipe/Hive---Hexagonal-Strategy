plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tecepeipe.bugzstrategy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tecepeipe.bugzstrategy'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Shared quality tooling (detekt + spotless + JUnit), see
// android-tools/quality/quality.gradle.
def props = new Properties()
rootProject.file('local.properties').withInputStream { props.load(it) }
def toolsDir = props.getProperty('android-tools.dir')
apply from: "$toolsDir/quality/quality.gradle"

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}